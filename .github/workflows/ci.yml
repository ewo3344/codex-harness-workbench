name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop

env:
  RUST_VERSION: '1.88.0'
  # Paseo requires Node 22 (see upstream/paseo/.tool-versions).
  NODE_VERSION: '22'

jobs:
  # 代码质量检查
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # This resolves upstream/paseo to the gitlink recorded by the root
          # repository. Update that pointer after publishing a fork revision.
          submodules: recursive

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
          override: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: upstream/paseo/package-lock.json

      - name: Rust format check
        run: cargo fmt --all -- --check

      - name: Rust clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Install Node dependencies
        run: cd upstream/paseo && npm ci

      - name: TypeScript lint
        run: cd upstream/paseo && npm run lint

  # Rust 测试
  test-rust:
    name: Test Rust Components
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          # This resolves upstream/paseo to the gitlink recorded by the root
          # repository. Update that pointer after publishing a fork revision.
          submodules: recursive

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          override: true

      - name: Cache Rust dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run Rust tests
        run: cargo test --workspace --locked

      - name: Run Rust tests with features
        run: cargo test --workspace --locked --features omp-walker

      - name: Generate coverage
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo install cargo-tarpaulin
          cargo tarpaulin --out Xml --workspace

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v3
        with:
          files: ./cobertura.xml
          flags: rust

  # TypeScript/Paseo 测试
  test-paseo:
    name: Test Paseo Components
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # This resolves upstream/paseo to the gitlink recorded by the root
          # repository. Update that pointer after publishing a fork revision.
          submodules: recursive

      - name: Record pinned Paseo revision
        run: git -C upstream/paseo rev-parse HEAD

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: upstream/paseo/package-lock.json

      - name: Install dependencies
        run: cd upstream/paseo && npm ci

      - name: Build
        run: cd upstream/paseo && npm run build:server

      - name: Run tests
        run: |
          cd upstream/paseo
          npx vitest run \
            packages/server/src/server/bootstrap.smoke.test.ts \
            packages/server/src/server/agent/provider-snapshot-manager.test.ts \
            --maxWorkers=1

  # 构建可发布的 Rust bridge 产物。Paseo 的桌面、移动端和 server 发布
  # 由 pinned submodule 自身的 workflows 负责，不在这里生成空的 dist 目录。
  build:
    name: Build Rust Bridge Artifacts
    needs: [lint, test-rust, test-paseo]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: linux-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: macos-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x64
    steps:
      - uses: actions/checkout@v4
        with:
          # Build and test the exact submodule revision recorded by the parent.
          submodules: recursive

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          target: ${{ matrix.target }}
          override: true

      - name: Build Rust
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          binary="target/${{ matrix.target }}/release/codex-bridge"
          if [[ ! -f "$binary" && -f "${binary}.exe" ]]; then
            binary="${binary}.exe"
          fi
          test -f "$binary"
          cp "$binary" "dist/codex-bridge-${{ matrix.artifact }}${binary##*codex-bridge}"
          {
            printf 'artifact=%s\n' '${{ matrix.artifact }}'
            printf 'target=%s\n' '${{ matrix.target }}'
            printf 'source_revision=%s\n' "$(git rev-parse HEAD)"
          } > "dist/codex-bridge-${{ matrix.artifact }}.build.txt"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: codex-harness-${{ matrix.artifact }}
          path: dist/

  # 发布（仅在打 tag 时）
  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 需要完整历史来生成 changelog

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Extract version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # 判断是否为预发布版本
          if [[ $VERSION =~ (alpha|beta|rc) ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ steps.version.outputs.version }}
          files: dist/**/*
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify
        if: steps.version.outputs.prerelease == 'false'
        run: |
          echo "🎉 Release ${{ steps.version.outputs.version }} published!"
          # 这里可以添加通知逻辑（Slack、Email 等）
