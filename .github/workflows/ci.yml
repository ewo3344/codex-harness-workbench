name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop

env:
  RUST_VERSION: '1.88.0'
  NODE_VERSION: '18'

jobs:
  # 代码质量检查
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
          override: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: upstream/paseo/package-lock.json

      - name: Rust format check
        run: cargo fmt --all -- --check

      - name: Rust clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Install Node dependencies
        run: cd upstream/paseo && npm ci

      - name: TypeScript lint
        run: cd upstream/paseo && npm run lint

  # Rust 测试
  test-rust:
    name: Test Rust Components
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          override: true

      - name: Cache Rust dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run Rust tests
        run: cargo test --workspace --locked

      - name: Run Rust tests with features
        run: cargo test --workspace --locked --features omp-walker

      - name: Generate coverage
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo install cargo-tarpaulin
          cargo tarpaulin --out Xml --workspace

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v3
        with:
          files: ./cobertura.xml
          flags: rust

  # TypeScript/Paseo 测试
  test-paseo:
    name: Test Paseo Components
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: upstream/paseo/package-lock.json

      - name: Install dependencies
        run: cd upstream/paseo && npm ci

      - name: Build
        run: cd upstream/paseo && npm run build:server

      - name: Run tests
        run: |
          cd upstream/paseo
          npm test -- \
            packages/server/src/server/bootstrap.smoke.test.ts \
            packages/server/src/server/agent/provider-snapshot-manager.test.ts \
            --maxWorkers=1

      - name: Generate coverage
        run: cd upstream/paseo && npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./upstream/paseo/coverage/lcov.info
          flags: paseo

  # 集成测试（需要真实 Codex）
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    # 只在 develop 和 main 分支运行，节省 CI 时间
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Setup Codex CLI
        run: |
          # 这里需要实际的 Codex 安装步骤
          # 暂时跳过，因为需要认证
          echo "Codex integration tests skipped (require authentication)"

      - name: Run integration tests
        if: false  # 暂时禁用
        run: CHW_REAL_CODEX_TESTS=1 ./scripts/verify-rust.sh

  # 构建产物
  build:
    name: Build Artifacts
    needs: [lint, test-rust, test-paseo]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: linux-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: macos-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          target: ${{ matrix.target }}
          override: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build Rust
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build Paseo
        run: |
          cd upstream/paseo
          npm ci
          npm run build:server
          npm run build:daemon-web-ui

      - name: Package artifacts
        run: |
          mkdir -p dist
          # 打包逻辑根据平台调整
          # TODO: 实现打包脚本

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: codex-harness-${{ matrix.artifact }}
          path: dist/*

  # 发布（仅在打 tag 时）
  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 需要完整历史来生成 changelog

      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: dist

      - name: Extract version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # 判断是否为预发布版本
          if [[ $VERSION =~ (alpha|beta|rc) ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate Release Notes
        run: |
          # 使用脚本生成 release notes
          chmod +x scripts/generate-release-notes.sh
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREVIOUS_TAG" ]; then
            ./scripts/generate-release-notes.sh ${{ steps.version.outputs.version }} $PREVIOUS_TAG > RELEASE_NOTES.md
          else
            echo "Initial release" > RELEASE_NOTES.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ steps.version.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: dist/**/*
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify
        if: steps.version.outputs.prerelease == 'false'
        run: |
          echo "🎉 Release ${{ steps.version.outputs.version }} published!"
          # 这里可以添加通知逻辑（Slack、Email 等）

  # 文档部署
  docs:
    name: Deploy Documentation
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build docs
        run: |
          # 如果有文档构建步骤
          echo "Documentation build placeholder"

      - name: Deploy to GitHub Pages
        if: false  # 暂时禁用
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
