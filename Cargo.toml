[workspace]
members = ["crates/codex-bridge", "crates/omp-primitives"]
exclude = ["upstream/oh-my-pi"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
